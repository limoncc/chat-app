<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChatApp</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a1a2e;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    /* 顶部标签工具栏：紧贴原生标题栏下方。高度与 Rust 侧 TAB_BAR_HEIGHT
       保持一致；macOS 左侧留出红绿灯区域，Windows 无需留空。 */
    #tabbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 32px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      background: rgba(24, 24, 40, 0.78);
      -webkit-backdrop-filter: blur(20px) saturate(1.4);
      backdrop-filter: blur(20px) saturate(1.4);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      -webkit-user-select: none;
      -webkit-app-region: drag; /* 空白区域允许拖动窗口 */
    }
    /* macOS 系统红绿灯在左上角，预留空间避免遮挡标签 */
    html[data-tauri-platform="macos"] #tabbar { padding-left: 78px; }

    #tabs {
      display: flex;
      align-items: center;
      gap: 4px;
      min-width: 0;
    }
    .tab {
      -webkit-app-region: no-drag;
      padding: 4px 12px;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: rgba(255, 255, 255, 0.55);
      font-size: 12px;
      line-height: 20px;
      cursor: pointer;
      outline: none;
      white-space: nowrap;
    }
    .tab:hover { background: rgba(255, 255, 255, 0.08); color: rgba(255, 255, 255, 0.85); }
    .tab.active { background: rgba(255, 255, 255, 0.15); color: #fff; }
  </style>
</head>
<body>
  <div id="tabbar">
    <div id="tabs"></div>
  </div>
  <script type="module">
    import {
      SITES,
      DEFAULT_TAB,
      renderTabs,
      updateActiveTab,
      activateTab,
      windowControl,
    } from "./src/tabs.js";

    const tabsEl = document.getElementById("tabs");
    let active = DEFAULT_TAB;

    renderTabs(tabsEl, SITES, active, async (key) => {
      if (key === active) return;
      const res = await activateTab(key);
      if (res.ok) active = key;
      updateActiveTab(tabsEl, active);
    });

    // 双击工具栏空白处最大化/还原，与原生标题栏行为一致。
    document.getElementById("tabbar").addEventListener("dblclick", (e) => {
      if (e.target.id === "tabbar") windowControl("toggle_maximize");
    });
  </script>
</body>
</html>
